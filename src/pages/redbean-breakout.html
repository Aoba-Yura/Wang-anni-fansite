<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110e0d">
  <meta name="description" content="红豆打砖块小游戏。">
  <title>红豆打砖块 | Anni Suki</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/game.css">
</head>
<body data-page="redbean-breakout">
  <div class="cursor-glow" aria-hidden="true"></div><div class="noise" aria-hidden="true"></div>
  <!-- SITE_HEADER -->

  <main class="game-shell">
    <a class="games-back" href="./game.html">← <span>返回小游戏</span><small lang="ja">ゲーム一覧へ</small></a>
    <header class="game-heading">
      <p class="game-eyebrow">红豆打砖块</p>
    </header>
    <div class="game-layout">
      <section class="game-board-wrap breakout-game" aria-label="红豆打砖块">
        <div class="game-hud" aria-label="游戏状态 / ゲーム状況">
          <div class="game-hud-title"><span>红豆打砖块</span></div>
          <div class="game-hud-stats">
            <span class="hud-life">机会<small lang="ja">ライフ</small> <b data-game-lives aria-label="剩余三次机会 / 残り3回">♥ ♥ ♥</b></span>
            <span>得分<small lang="ja">スコア</small> <b data-game-score>0000</b></span>
            <span class="hud-best">最高<small lang="ja">ベスト</small> <b data-game-best>0000</b></span>
          </div>
          <div class="game-hud-actions">
            <button type="button" class="hud-icon-button" data-game-pause disabled aria-label="暂停游戏 / 一時停止" title="暂停游戏 / 一時停止">⏸</button>
            <button type="button" class="hud-reset-button" data-game-reset><span>重新开始</span><small lang="ja">リセット</small></button>
          </div>
        </div>
        <canvas id="breakout-game" width="900" height="600" data-dog-src="../assets/images/pomeranian-ball.png" aria-label="红豆打砖块游戏区域 / ゲーム画面">你的浏览器需要支持 Canvas 才能运行这个小游戏。Canvas 対応ブラウザーをご利用ください。</canvas>
        <div class="game-overlay" data-game-overlay>
          <p data-overlay-kicker>READY?</p>
          <h2 data-overlay-title>红豆打砖块</h2>
          <p data-overlay-copy>方向键或手指拖动挡板<br><small lang="ja">矢印キー、または指でバーを動かします</small></p>
          <div class="game-overlay-actions">
            <button type="button" data-game-start><span>开始游戏<small lang="ja">スタート</small></span><b aria-hidden="true">→</b></button>
            <button type="button" class="overlay-secondary" data-game-overlay-reset hidden><span>重新开始<small lang="ja">リセット</small></span></button>
          </div>
        </div>
      </section>
    </div>
    <p class="game-status" data-game-status aria-live="polite">等待开始<small lang="ja">スタート待機</small></p>
  </main>

  <!-- SITE_FOOTER -->
  <nav class="mobile-nav" aria-label="手机端主导航"><a href="./index.html"><b aria-hidden="true">⌂</b><span>首页</span></a><a href="./profile.html"><b aria-hidden="true">✦</b><span>档案</span></a><a href="./diary.html"><b aria-hidden="true">✎</b><span>日志</span></a><a href="./notices.html"><b aria-hidden="true">♡</b><span>公告</span></a><a href="./hymn.html"><b aria-hidden="true">✿</b><span>安妮颂</span></a><a class="active" href="./game.html"><b aria-hidden="true">▦</b><span>游戏</span></a></nav>
  <script src="../scripts/main.js"></script>
  <script src="../scripts/game.js"></script>
</body>
</html>
