<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110e0d">
  <meta name="description" content="红豆打砖块小游戏。">
  <title>红豆打砖块 · Anni Suki</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/game.css">
</head>
<body data-page="redbean-breakout">
  <div class="cursor-glow" aria-hidden="true"></div><div class="noise" aria-hidden="true"></div>
  <!-- SITE_HEADER -->

  <main class="game-shell">
    <a class="games-back" href="./game.html">← 返回小游戏</a>
    <header class="game-heading">
      <p class="game-eyebrow" lang="ja">紅豆ブロック崩し</p>
    </header>
    <div class="game-layout">
      <div class="game-board-wrap">
        <canvas id="breakout-game" width="960" height="680" data-dog-src="../assets/images/pomeranian-ball.png" aria-label="红豆打砖块游戏区域">你的浏览器需要支持 Canvas 才能运行这个小游戏。</canvas>
        <div class="game-overlay" data-game-overlay>
          <p data-overlay-kicker>READY?</p>
          <h2 data-overlay-title>红豆打砖块</h2>
          <p data-overlay-copy>方向键、A / D 或手指拖动挡板</p>
          <button type="button" data-game-start>开始游戏 <span>→</span></button>
        </div>
      </div>
      <aside class="game-console" aria-label="游戏信息与控制">
        <div class="score-grid"><div><span>SCORE</span><strong data-game-score>0000</strong></div><div><span>BEST</span><strong data-game-best>0000</strong></div></div>
        <div class="lives-row"><span>LIFE</span><strong data-game-lives aria-label="剩余三次机会">♥ ♥ ♥</strong></div>
        <div class="game-buttons"><button type="button" data-game-pause disabled>暂停</button><button type="button" data-game-reset>重新开始</button></div>
      </aside>
    </div>
    <p class="game-status" data-game-status aria-live="polite">等待开始</p>
  </main>

  <!-- SITE_FOOTER -->
  <nav class="mobile-nav" aria-label="手机端主导航"><a href="./index.html"><b aria-hidden="true">⌂</b><span>首页</span></a><a href="./profile.html"><b aria-hidden="true">✦</b><span>档案</span></a><a href="./diary.html"><b aria-hidden="true">✎</b><span>日志</span></a><a href="./notices.html"><b aria-hidden="true">♡</b><span>公告</span></a><a href="./hymn.html"><b aria-hidden="true">✿</b><span>安妮颂</span></a><a class="active" href="./game.html"><b aria-hidden="true">▦</b><span>游戏</span></a></nav>
  <script src="../scripts/main.js"></script>
  <script src="../scripts/game.js"></script>
</body>
</html>
